<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test</title></head>
<body style="font:16px sans-serif;background:#000814;color:#cff4ff;padding:20px">
<button id="go" style="font-size:16px;padding:12px">Avvia il test</button>
<pre id="out" style="white-space:pre-wrap">Tocca il pulsante.</pre>
<script>
const out=document.getElementById('out');
async function t(nome,fn){
  const t0=performance.now();
  let esito='ok';
  try{await Promise.race([fn(),new Promise((_,r)=>setTimeout(()=>r(new Error('oltre 60 s')),60000))]);}
  catch(e){esito='ERRORE: '+String(e.message).slice(0,100);}
  out.textContent+='\n'+nome+': '+((performance.now()-t0)/1000).toFixed(1)+' s ('+esito+')';
}
const key=()=>localStorage.getItem('key')||'';
const model=()=>localStorage.getItem('model')||'gemini-3.5-flash-lite';
const gem=()=>async()=>{
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model()+':generateContent?key='+encodeURIComponent(key()),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:'Rispondi solo: ok'}]}]})});
  const j=await r.json();
  if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
};
document.getElementById('go').onclick=async()=>{
  out.textContent='Modello: '+model();
  await t('Rete semplice',async()=>{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name=Roma&count=1');await r.json();});
  await t('Gemini 1',gem());
  await t('Gemini 2',gem());
  out.textContent+='\n\nFine. Fai uno screenshot.';
};
</script></body></html>
